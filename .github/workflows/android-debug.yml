
name: English Ustad Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: |
          chmod +x android/gradlew
          npm run android:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Ustad-TEST-APK
          path: output/English-Ustad.apk
          if-no-files-found: error
