# Cloud build for the iPhone app (no Mac needed). See docs/IOS-BUILD.md for the one-time setup.
# Before the first build, in Codemagic: add an App Store Connect API key integration named "english_ustad_asc",
# and register the bundle id com.englishustad.app in your Apple Developer account.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: english_ustad_asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.englishustad.app
    scripts:
      - name: Install
        script: npm ci
      - name: Build the web app and copy it into the iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build the iPhone app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
